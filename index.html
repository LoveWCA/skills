<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>“球会友谊联赛技能积分兑换系统”</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        body { background: #f5f5f5; padding: 20px; max-width: 900px; margin: 0 auto; }
        .container { background: #fff; border: 1px solid #000; padding: 20px; }
        h1 { text-align: center; font-size: 24px; margin-bottom: 15px; }
        h2 { font-size: 20px; margin: 20px 0 10px; border-bottom: 1px solid #000; padding-bottom: 5px; }
        .hidden { display: none; }
        button { background: #fff; color: #000; border: 1px solid #000; padding: 8px 16px; font-size: 14px; cursor: pointer; }
        button:hover { background: #f0f0f0; }
        .back-btn { display: block; width: 100%; padding: 10px; font-size: 16px; margin-bottom: 20px; }
        .manual { font-size: 15px; line-height: 1.8; }
        .manual h3 { margin: 15px 0 5px; }
        .manual ul { margin-left: 25px; }
        .skill-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .skill-table th, .skill-table td { border: 1px solid #000; padding: 5px 8px; text-align: left; font-size: 13px; }
        .skill-table th { background: #f0f0f0; }
        .login-box { max-width: 400px; margin: 20px auto; }
        .login-box input { width: 100%; padding: 10px 0; margin-bottom: 10px; border: none; border-bottom: 1px solid #000; background: transparent; font-size: 16px; outline: none; }
        .select-section { margin: 15px 0; }
        .star-option { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed #ccc; }
        .star-option label { flex: 1; cursor: pointer; }
        .star-option input[type="radio"] { margin-right: 10px; }
        .selected-info { margin-top: 10px; padding: 10px; background: #f9f9f9; border: 1px solid #ccc; }
        @media (max-width: 600px) {
            body { padding: 10px; }
            .container { padding: 15px; }
            h1 { font-size: 20px; }
            .skill-table th, .skill-table td { font-size: 11px; padding: 3px 4px; }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 返回主站按钮 -->
    <button class="back-btn" onclick="goBack()">← 返回主站</button>
    <h1>“球会友谊联赛技能积分兑换系统”</h1>

    <!-- 用户手册视图 -->
    <div id="manualView">
        <div class="manual">
            <h2>用户手册</h2>
            <!-- 手册内容（精简） -->
            <p><strong>用户协议：</strong>本系统与主站积分互通，请遵守规则。</p>
            <p><strong>技能详述：</strong>完成相应球星技能并经管理员核实后获得积分。</p>
            <p><strong>兑换规则：</strong>积分可在主站兑换奖品，365天有效。</p>
            <h3>各位置技能概览</h3>
            <p>守门员、后卫、中场、前锋技能详见下方选择区。</p>
        </div>
        <button onclick="showLogin()" style="width:100%; margin-top:20px;">同意，下一步</button>
    </div>

    <!-- 登录视图 -->
    <div id="loginView" class="login-box hidden">
        <h3>队员登录</h3>
        <input type="text" id="accountInput" placeholder="账号">
        <input type="password" id="passwordLast4Input" placeholder="密码后4位" maxlength="4">
        <button onclick="loginUser()" style="width:100%;">登录</button>
        <p style="margin-top:10px; text-align:center;"><a href="#" onclick="showManual()">返回用户手册</a></p>
    </div>

    <!-- 技能选择视图 -->
    <div id="selectView" class="hidden">
        <h2>选择发动技能</h2>
        <p>请在守门员、后卫、前锋/中场中各选择一名球员发动技能。超额选择无效。</p>

        <!-- 守门员选择 -->
        <div class="select-section">
            <h3>守门员（选择1名）</h3>
            <div id="gkOptions" class="star-options"></div>
        </div>

        <!-- 后卫选择 -->
        <div class="select-section">
            <h3>后卫（选择1名）</h3>
            <div id="dfOptions" class="star-options"></div>
        </div>

        <!-- 前锋/中场选择 -->
        <div class="select-section">
            <h3>前锋 / 中场（选择1名）</h3>
            <div id="fwOptions" class="star-options"></div>
        </div>

        <div class="selected-info" id="selectedSummary">
            已选择：未选择
        </div>
        <button onclick="submitSelection()" style="width:100%; margin-top:10px;">选择该球员并体现技能</button>
        <p style="text-align:center; margin-top:10px;"><button onclick="logoutUser()" style="background:none; border:none; color:#000; text-decoration:underline;">退出登录</button></p>
    </div>
</div>

<script>
    var SUPABASE_URL = 'https://hjktfecloctfpaoohzax.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhqa3RmZWNsb2N0ZnBhb29oemF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4ODQ5MzksImV4cCI6MjEwMjQ2MDkzOX0.Kd94mBz7-2EX9Xu3HZUKawIgUWCrVbFsH7rXFyz7WUg';

    function getHeaders() {
        return {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
            'Content-Type': 'application/json'
        };
    }

    async function apiFetch(path, options) {
        options = options || {};
        options.headers = getHeaders();
        var response = await fetch(SUPABASE_URL + path, options);
        if (!response.ok) throw new Error('API错误 ' + response.status);
        return await response.json();
    }

    var currentUser = null;

    function showManual() {
        document.getElementById('manualView').classList.remove('hidden');
        document.getElementById('loginView').classList.add('hidden');
        document.getElementById('selectView').classList.add('hidden');
    }

    function showLogin() {
        document.getElementById('manualView').classList.add('hidden');
        document.getElementById('loginView').classList.remove('hidden');
        document.getElementById('selectView').classList.add('hidden');
    }

    function goBack() {
        window.location.href = 'https://lovewca.github.io/xiaolishenbei-points/';
    }

    async function loginUser() {
        var account = document.getElementById('accountInput').value.trim();
        var last4 = document.getElementById('passwordLast4Input').value.trim();
        if (!account || !last4) { alert('请输入账号和密码后4位'); return; }
        try {
            var data = await apiFetch('/rest/v1/rpc/login_user_last4', {
                method: 'POST',
                body: JSON.stringify({ p_account: account, p_last4: last4 })
            });
            if (data && data.success) {
                currentUser = { id: data.user_id, name: data.name, points: data.points, account: account };
                showSelection();
            } else {
                alert(data.msg || '账号或密码后4位错误');
            }
        } catch (e) {
            console.error(e);
            alert('登录失败，请检查网络或配置');
        }
    }

    function showSelection() {
        document.getElementById('manualView').classList.add('hidden');
        document.getElementById('loginView').classList.add('hidden');
        document.getElementById('selectView').classList.remove('hidden');
        renderStarOptions();
    }

    function renderStarOptions() {
        // 守门员数据
        const gkStars = [
            { id:'gk1', name:'伊克尔·卡西利亚斯', info:'西班牙 / 皇家马德里', skill:'第二反应、破解单刀、出击型守门员' },
            { id:'gk2', name:'詹路易吉·布冯', info:'意大利 / 帕尔马', skill:'出击型守门员' },
            { id:'gk3', name:'埃米利亚诺·马丁内斯', info:'阿根廷 / 阿斯顿维拉', skill:'抽射挡出' },
            { id:'gk4', name:'奥利弗·卡恩', info:'德国 / 卡尔斯鲁厄', skill:'门线救球、挡出点球' }
        ];
        const dfStars = [
            { id:'df1', name:'保罗·马尔蒂尼', info:'意大利 / AC米兰', skill:'优雅卡位' },
            { id:'df2', name:'法比奥·卡纳瓦罗', info:'意大利 / 皇家马德里', skill:'贴身防守、精准防守' },
            { id:'df3', name:'维吉尔·范戴克', info:'荷兰 / 利物浦', skill:'回追速度、一对一单防' },
            { id:'df4', name:'特伦特·亚历山大·阿诺德', info:'英格兰 / 利物浦', skill:'转移球、精准定位球' },
            { id:'df5', name:'马科斯·埃万热利斯塔·德·莫赖斯', info:'巴西 / AC米兰', skill:'极强体能往返跑、精准沉底' }
        ];
        const fwStars = [
            { id:'fw1', name:'卢卡·莫德里奇', info:'克罗地亚 / AC米兰', skill:'原地贴身摆脱、中场节奏控制力强' },
            { id:'fw2', name:'凯文·德布劳内', info:'比利时 / 那不勒斯', skill:'暴力射门' },
            { id:'fw3', name:'祖德·维克托·威廉·贝林厄姆', info:'英格兰 / 皇家马德里', skill:'速度爆发力强、身体对抗' },
            { id:'fw4', name:'迭戈·阿曼多·马拉多纳', info:'阿根廷 / 博卡青年', skill:'重炮远射、极强体能等' },
            { id:'fw5', name:'齐内丁·齐达内', info:'法国 / 皇家马德里', skill:'马赛回旋、停球控场、远射' },
            { id:'fw6', name:'米歇尔·普拉蒂尼', info:'法国 / 尤文图斯', skill:'直塞球、定位球破门' },
            { id:'fw7', name:'哈里·爱德华·凯恩', info:'英格兰 / 拜仁慕尼黑', skill:'回撤、转移球、无逆足' },
            { id:'fw8', name:'基利安·姆巴佩', info:'法国 / 巴黎圣日尔曼', skill:'瞬间爆发、直线过人' },
            { id:'fw9', name:'埃尔林·布劳特·哈兰德', info:'挪威 / 曼彻斯特城', skill:'瞬间爆发、身体卡位等' },
            { id:'fw10', name:'路易斯·苏亚雷斯', info:'乌拉圭 / 迈阿密国际', skill:'鬼魅嗅觉、穿裆射门' },
            { id:'fw11', name:'埃德松·阿兰特斯', info:'巴西 / 纽约宇宙', skill:'全能球感、盘带' },
            { id:'fw12', name:'罗纳尔多·路易斯', info:'巴西 / 国际米兰', skill:'爆发力强、钟摆过人' },
            { id:'fw13', name:'克里斯蒂亚诺·罗纳尔多', info:'葡萄牙 / 利雅得胜利', skill:'暴力抽射、点球' },
            { id:'fw14', name:'利昂内尔·梅西', info:'阿根廷 / 迈阿密', skill:'连续盘带、上帝视野' },
            { id:'fw15', name:'内马尔', info:'巴西 / 桑托斯', skill:'点球' }
        ];

        renderOptions('gkOptions', gkStars, 'gk');
        renderOptions('dfOptions', dfStars, 'df');
        renderOptions('fwOptions', fwStars, 'fw');
    }

    function renderOptions(containerId, stars, group) {
        const container = document.getElementById(containerId);
        container.innerHTML = '';
        stars.forEach(star => {
            const div = document.createElement('div');
            div.className = 'star-option';
            div.innerHTML = `
                <label>
                    <input type="radio" name="${group}" value="${star.id}" onchange="updateSelection()">
                    ${star.name} - ${star.info} - 技能：${star.skill}
                </label>
            `;
            container.appendChild(div);
        });
    }

    function updateSelection() {
        const selected = {};
        document.querySelectorAll('input[type="radio"]:checked').forEach(input => {
            selected[input.name] = input.value;
        });
        const summary = document.getElementById('selectedSummary');
        if (Object.keys(selected).length === 3) {
            summary.textContent = `已选择：守门员(${selected.gk})，后卫(${selected.df})，前锋/中场(${selected.fw})`;
        } else {
            summary.textContent = '已选择：未选择完整（请在三个位置各选一名）';
        }
    }

    async function submitSelection() {
    const selected = {};
    document.querySelectorAll('input[type="radio"]:checked').forEach(input => {
        selected[input.name] = input.value;
    });
    if (Object.keys(selected).length !== 3) {
        alert('请确保在守门员、后卫、前锋/中场各选择一名球员');
        return;
    }

    // 获取具体球员名称（需要从数据数组中查找）
    const gkStars = [...]; // 你的守门员数组
    const dfStars = [...]; // 后卫数组
    const fwStars = [...]; // 前锋/中场数组

    const gkName = gkStars.find(s => s.id === selected.gk)?.name || selected.gk;
    const dfName = dfStars.find(s => s.id === selected.df)?.name || selected.df;
    const fwName = fwStars.find(s => s.id === selected.fw)?.name || selected.fw;

    try {
        const data = await apiFetch('/rest/v1/rpc/submit_skill_selection', {
            method: 'POST',
            body: JSON.stringify({
                p_user_id: currentUser.id,
                p_gk: gkName,
                p_df: dfName,
                p_fw_mid: fwName
            })
        });
        if (data && data.success) {
            alert('技能选择已提交，请等待管理员核实');
        } else {
            alert(data.msg || '提交失败');
        }
    } catch (e) {
        console.error(e);
        alert('提交失败，请重试');
    }
}

    function logoutUser() {
        currentUser = null;
        showLogin();
    }

    // 初始显示手册
    showManual();
</script>
</body>
</html>
